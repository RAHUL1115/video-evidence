<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video Evidence</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --border: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --border: #333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px; }
  nav { display: flex; gap: 8px; margin: 12px 0; }
  button { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: none; color: inherit; font: inherit; cursor: pointer; }
  button[aria-current="true"] { background: var(--fg); color: var(--bg); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Video Evidence</h1>
  <p>Recorded 12 Sep 2026 · 15:21 total in 3 parts · plays through automatically</p>
  <video id="v" controls playsinline preload="metadata" src="part1.mp4"></video>
  <nav id="parts"></nav>
  <p>Download: <a href="part1.mp4" download>Part 1</a> · <a href="part2.mp4" download>Part 2</a> · <a href="part3.mp4" download>Part 3</a></p>
</main>
<script>
  const parts = ["part1.mp4", "part2.mp4", "part3.mp4"];
  const v = document.getElementById("v");
  const nav = document.getElementById("parts");
  let current = 0;
  const buttons = parts.map((src, i) => {
    const b = document.createElement("button");
    b.textContent = `Part ${i + 1}`;
    b.onclick = () => load(i, true);
    nav.appendChild(b);
    return b;
  });
  function load(i, play) {
    current = i;
    v.src = parts[i];
    buttons.forEach((b, j) => b.setAttribute("aria-current", j === i));
    if (play) v.play();
  }
  v.addEventListener("ended", () => { if (current < parts.length - 1) load(current + 1, true); });
  load(0, false);
</script>
</body>
</html>
